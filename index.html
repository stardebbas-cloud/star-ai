<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 95%;
      max-width: 800px;
      height: 90vh;
      background: #131a2a;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #2b3448;
    }

    header h1 {
      margin: 0;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 80%;
    }

    .ai {
      background: #242d40;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #2b3448;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>⭐ STAR AI</h1>
    <small>Your AI Assistant</small>
  </header>

  <div id="chat">
    <div class="message ai">
      Hello 👋 I'm STAR AI. How can I help you?
    </div>
  </div>

  <div class="input-area">
    <input id="message" type="text" placeholder="Message STAR AI...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  if (input.value.trim() === "") return;

  const message = document.createElement("div");
  message.className = "message user";
  message.textContent = input.value;

  chat.appendChild(message);
  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
